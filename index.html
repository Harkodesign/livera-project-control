<title>Project Control</title>

<style>
/* Layout: a dark LIVERA rail on the left, one working view on the right, routed by hash. Phone: rail becomes a scrolling tab strip. */
:root{
  --bg:#f7f5f1; --surface:#ffffff; --sunk:#efeae2; --ink:#221e1b; --muted:#6e6862; --line:#e2dbd0;
  --accent:#8a5a3b; --accent-ink:#ffffff; --sand:#e2c9a4;
  --rail:#2a221c; --rail-ink:#f5f1ec; --rail-muted:#b9a995; --rail-hi:#3a3028;
  --ok:#2e6b3e; --ok-bg:#e3efe4; --warn:#a85f12; --warn-bg:#fbe9d6; --bad:#a23a32; --bad-bg:#f6dedb;
  --info:#1f4e79; --info-bg:#dfe8f1; --idle:#6e6862; --idle-bg:#ece6dd;
  --shadow:0 1px 2px rgba(42,34,28,.06),0 10px 28px rgba(42,34,28,.07);
  --display:'Inter Tight','Inter',system-ui,sans-serif; --text:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a1512; --surface:#252019; --sunk:#2e2720; --ink:#f1ebe3; --muted:#b0a596; --line:#3b332b;
  --accent:#d4a273; --accent-ink:#1a1512; --sand:#5a4a39;
  --rail:#120e0c; --rail-ink:#f5f1ec; --rail-muted:#a39584; --rail-hi:#2a221c;
  --ok:#8fd19e; --ok-bg:#1f3626; --warn:#f0b56b; --warn-bg:#40301a; --bad:#f0958c; --bad-bg:#44221f;
  --info:#9cc3ea; --info-bg:#1d3145; --idle:#b0a596; --idle-bg:#332c25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1a1512; --surface:#252019; --sunk:#2e2720; --ink:#f1ebe3; --muted:#b0a596; --line:#3b332b;
  --accent:#d4a273; --accent-ink:#1a1512; --sand:#5a4a39;
  --rail:#120e0c; --rail-ink:#f5f1ec; --rail-muted:#a39584; --rail-hi:#2a221c;
  --ok:#8fd19e; --ok-bg:#1f3626; --warn:#f0b56b; --warn-bg:#40301a; --bad:#f0958c; --bad-bg:#44221f;
  --info:#9cc3ea; --info-bg:#1d3145; --idle:#b0a596; --idle-bg:#332c25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 12px 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .logo{width:112px;height:auto;display:block;margin:2px 8px 0}
.rail .proj{margin:0 8px;font-size:12px;color:var(--rail-muted);line-height:1.35}
.rail .proj b{display:block;color:var(--rail-ink);font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;color:var(--rail-muted);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--rail-hi);color:var(--rail-ink)}
.nav a.on{background:var(--rail-hi);color:var(--rail-ink);box-shadow:inset 2px 0 0 var(--sand)}
.nav a .n{font-size:11px;font-variant-numeric:tabular-nums;color:var(--rail-muted)}
.nav .sep{height:1px;background:var(--rail-hi);margin:8px 6px}
.who{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--rail-hi);font-size:12px;color:var(--rail-muted)}
.who b{display:block;color:var(--rail-ink);font-weight:500}
.main{padding-block:26px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.head h1{font-size:30px;line-height:1.1;margin-top:3px}
.head p{color:var(--muted);margin:4px 0 0;max-width:65ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.tools select,.tools input{width:auto}
textarea{min-height:72px;resize:vertical}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 13px;margin-bottom:14px;font-weight:500}
.banner.q{background:var(--sunk);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:12px 14px}
.tile .v{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card>h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card>h3 a{font-family:var(--text);font-size:12px;font-weight:600;color:var(--accent);text-decoration:none}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{font-weight:500;min-width:0}
.li .s{font-size:12px;color:var(--muted)}
.li .r{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.empty{color:var(--muted);padding:18px 0;font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--idle-bg);color:var(--idle)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.late{color:var(--bad);font-weight:600}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:hover{background:var(--sunk)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .s{font-size:12px;color:var(--muted)}
tr.sum td{font-weight:600;border-top:2px solid var(--ink)}
.gwrap{overflow-x:auto}
.gantt{display:grid;grid-template-columns:minmax(150px,230px) minmax(420px,1fr);row-gap:0;min-width:600px}
.gantt .gn{padding:9px 10px 9px 0;border-top:1px solid var(--line);font-weight:500;cursor:pointer;min-width:0}
.gantt .gn .s{font-size:12px;color:var(--muted);font-weight:400}
.gantt .gt{position:relative;border-top:1px solid var(--line);min-height:44px}
.gantt .gh{position:relative;height:22px}
.gantt .gh span{position:absolute;top:0;font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding-left:4px;height:22px;white-space:nowrap}
.gbar{position:absolute;top:13px;height:18px;border-radius:5px;background:var(--sand);overflow:hidden;min-width:4px}
.gbar i{display:block;height:100%;background:var(--accent)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.kcol{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.kcol h3{font-size:13px;display:flex;justify-content:space-between;margin:2px 4px 10px}
.kcol h3 span{color:var(--muted);font-family:var(--text);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.kcard .t{font-weight:500}
.kcard .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:12px;color:var(--muted)}
.kcard .mv{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:76px;height:58px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.chk.done span{color:var(--muted);text-decoration:line-through}
.addrow{display:flex;gap:6px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
#modal{position:fixed;inset:0;background:rgba(20,15,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:50}
.panel{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(680px,100%);padding:20px 22px;position:relative}
.panel h2{font-size:20px;margin-bottom:14px;padding-right:30px}
.x{position:absolute;right:12px;top:12px;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:6px 9px;border-radius:6px}
.x:hover{background:var(--sunk)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.fgrid label.w{grid-column:1/-1}
.frow{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.grow{flex:1}
.ferr{color:var(--bad);font-weight:500;margin:10px 0 0}
.fmeta{font-size:11.5px;color:var(--muted);margin:10px 0 0}
.ver{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ver .vn{font-family:var(--display);font-weight:600;font-size:16px;min-width:34px}
.ver .va{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ver.cur{background:var(--ok-bg);margin:0 -10px;padding:10px;border-radius:8px;border-top:0}
.sect{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:18px 0 6px}
.prev{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}
  .rail .logo{width:70px;margin:0;flex:none}
  .rail .proj,.who,.nav .sep{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a .n{display:none}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--sand)}
  .main{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head h1{font-size:24px}
  .kan{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .panel{animation:pop .14s ease-out} @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}} }
</style>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
var COLS=['stages','tasks','files','drawings','approvals','logs','snags','checks','materials','people','budget','payments'];
var ADMIN_COLS={budget:1,payments:1};
var S={data:{},loaded:{},route:'overview',ui:{taskStage:'',taskQ:'',folder:'All',fileQ:'',siteTab:'logs',drawStatus:'',drawQ:''},me:null,canWrite:true,canAdmin:false,names:{},dbState:'wait',stale:false,modalRefresh:null,usage:null,meta:{},members:null};
COLS.forEach(function(c){S.data[c]=[]});
var db=null,A=null,U=null,D=null,B=window.NPC||null;
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){return n<10?'0'+n:''+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fd(iso){if(!iso)return '—';var p=String(iso).slice(0,10).split('-');if(p.length<3)return esc(iso);return (+p[2])+' '+MON[+p[1]-1]+' '+p[0]}
function fdt(iso){if(!iso)return '—';var d=new Date(iso);if(isNaN(d))return fd(iso);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes())}
function num(n){return (n==null||n==='')?'—':Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function inr(n){return (n==null||n==='')?'—':'₹'+Math.round(Number(n)).toLocaleString('en-IN')}
function inrS(n){n=Number(n)||0;if(Math.abs(n)>=1e7)return '₹'+(n/1e7).toFixed(2)+' cr';if(Math.abs(n)>=1e5)return '₹'+(n/1e5).toFixed(1)+' lakh';return inr(n)}
function fsize(b){if(!b)return '';if(b>=1048576)return (b/1048576).toFixed(1)+' MB';return Math.max(1,Math.round(b/1024))+' KB'}
var PC={'Done':'ok','Approved':'ok','Current':'ok','Closed':'ok','Delivered':'ok','Paid':'ok','Issued':'ok','Complete':'ok','For construction':'ok',
 'Fixed':'info','Doing':'info','In progress':'info','Submitted':'info','In review':'info','For review':'info','Ordered':'info',
 'For NHAI':'warn','Medium':'warn','Due':'warn','Part delivered':'warn','On hold':'warn',
 'Blocked':'bad','Rejected':'bad','Open':'bad','High':'bad'};
function pill(s){return s?'<span class="pill '+(PC[s]||'')+'">'+esc(s)+'</span>':''}
function find(col,id){return S.data[col].filter(function(d){return d.id===id})[0]}
function stages(){return S.data.stages.slice().sort(function(a,b){return (a.order||0)-(b.order||0)})}
function stageName(id){var s=find('stages',id);return s?s.name:''}
function who(id,fallback){return id?(S.names[id]||'Someone'):(fallback||'')}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3600)}
function errMsg(e){var c=e&&e.code;
  if(c==='too_large')return 'Files must be 50 MB or smaller. Add a link instead.';
  if(c==='unsupported_type')return 'That file type can’t be stored here. Add it as a link instead.';
  if(c==='quota_or_state'||c==='quota_exceeded')return 'Storage is full. Remove old files first.';
  if(c==='invalid_argument')return 'You don’t have permission to change this.';
  if(c==='not_granted'||c==='revoked')return 'Your access to this page changed. Reload to continue.';
  if(c==='declined')return '';
  return 'That didn’t go through. Try again.'}
function guard(p){return Promise.resolve(p).catch(function(e){var m=errMsg(e);if(m)toast(m);if(window.console)console.warn(e)})}
function save(col,id,obj){var o=clone(obj);delete o.id;o.updatedAt=new Date().toISOString();if(S.me&&S.me.id)o.updatedBy=S.me.id;
  var ref=id?db.collection(col).doc(id):db.collection(col).doc();return ref.set(o).then(function(){return ref.id})}

/* ---------- schemas for the generic add/edit form ---------- */

  var h='<form id="nf" novalidate><h2>Add file</h2><div class="fgrid">'+(A?'<label class="w" for="nf_file">File (any type, up to 50 MB)<input type="file" id="nf_file"></label>':'')+'<label class="w" for="nf_url">'+(A?'Or a link, for bigger files or files kept elsewhere':'Link to the file')+'<input type="url" id="nf_url" placeholder="https://"></label><label class="w" for="nf_name">File name<input type="text" id="nf_name" placeholder="Taken from the file if left blank"></label><label for="nf_folder">Folder<input type="text" id="nf_folder" list="dl_nf" value="'+esc(S.ui.folder!=='All'?S.ui.folder:'')+'"><datalist id="dl_nf">'+folders().map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist></label><label for="nf_status">Status<select id="nf_status">'+opts(['Draft','For review','Approved','Issued'],'Draft')+'</select></label><label class="w" for="nf_note">Note for version 1<input type="text" id="nf_note" value="First upload"></label></div><p class="ferr" id="ferr" hidden></p><div class="frow"><span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" id="nf_btn">Add file</button></div></form>';

      v.n=1;return save('files',null,{name:name,folder:$('#nf_folder').value.trim()||'Unfiled',status:$('#nf_status').value,current:1,versions:[v],createdAt:new Date().toISOString()}).then(function(){closeModal();toast('File added')})

 addver:function(d){var f=find('files',d.id);if(!f)return;var file=$('#nv_file')&&$('#nv_file').files[0],url=$('#nv_url').value.trim(),er=$('#ferr'),btn=$('#nv_btn');

  .catch(function(e){btn.disabled=false;btn.textContent='Add version';er.textContent=errMsg(e)||'Not added.';er.hidden=false})},

 dl:function(d,el){var f=find('files',d.id),v=f&&f.versions.filter(function(x){return x.n===+d.n})[0];if(!v||!D)return;var e=ext(v.fname)||Object.keys(TYPES).filter(function(k){return TYPES[k]===v.type})[0]||'pdf';

 delfile:function(d,el){if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirm: delete all versions';return}var f=find('files',d.id);if(!f)return;var assets=(f.versions||[]).map(function(v){return v.asset}).filter(Boolean);

};
function mkVersion(file,url,note){var base={note:note||'',at:new Date().toISOString(),by:S.me&&S.me.id||null};
  if(file)return upload(file).then(function(r){base.asset=r.id;base.size=r.sizeBytes;base.type=r.contentType;base.fname=file.name;return base});
  if(!/^https?:\/\//i.test(url))return Promise.reject({code:'bad_link'});base.url=url;return Promise.resolve(base)}

  var bl=e.target.closest('a[data-bhref]');if(bl){e.preventDefault();e.stopPropagation();openBlob(bl.getAttribute('data-bhref'));return}
  var t=e.target.closest('[data-act]');if(!t)return;var a=ACT[t.dataset.act];if(!a)return;
  if(t.type!=='checkbox')e.preventDefault();e.stopPropagation();a(t.dataset,t,e)});

  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.kcard,.gn')){e.preventDefault();e.target.click()}

function start(){
  route();
  var c=window.claude;if(!c||!c.use){S.dbState='none';render();return}
  var use=function(n){return c.use(n).catch(function(){return null})};
  Promise.all([use('db'),use('user'),use('assets'),use('downloads')]).then(function(r){db=r[0];U=r[1];A=r[2];D=r[3];
    var p=Promise.resolve();
    if(U)p=Promise.all([U.me(),U.canEdit(),U.can('data.write')]).then(function(x){S.me=x[0];S.canAdmin=!!x[1];S.canWrite=x[2]!==false}).catch(function(){});
    return p}).then(function(){
    if(!db){S.dbState='none';render();return}
    S.dbState='loading';render();
    db.collection('meta').onSnapshot(function(snap){var d=snap.docs.filter(function(x){return x.id==='project'})[0];S.meta=d?d.data():{};schedule()},function(){});
    loadMembers();
    var cols=COLS.filter(function(k){return !ADMIN_COLS[k]||S.canAdmin});
    var timer=setTimeout(function(){if(S.dbState!=='ready'){S.stale=true;render()}},10000);
    cols.forEach(function(col){db.collection(col).onSnapshot(function(snap){
      S.data[col]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.loaded[col]=true;
      if(cols.every(function(k){return S.loaded[k]})){S.dbState='ready';if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}}
      schedule()},function(err){S.loaded[col]=true;if(cols.every(function(k){return S.loaded[k]}))S.dbState='ready';clearTimeout(timer);if(err&&err.code==='revoked')toast('Your access to this page changed. Reload to continue.');schedule()})})
  })}
start();
})();
